function parseGap(w) { const m = /^(.*)\[(.+?)\](.*)$/.exec(w); return { pre: m[1], tgt: m[2], post: m[3], word: m[1] + m[2] + m[3] }; }
// tarjeta con palabra y hueco
function wordCard(x, y, it, o = {}) {
  const size = o.size || 46, c = G.ctx; c.font = font(size);
  const gw = Math.max(46, c.measureText(o.fill || 'll').width + 20);
  const pw = c.measureText(it.pre).width, qw = c.measureText(it.post).width;
  const w = pw + gw + qw + 44, h = size * 1.5;
  c.save(); c.translate(x, y); if (o.sc) c.scale(o.sc, o.sc); if (o.rot) c.rotate(o.rot);
  if (o.hl) { rr(-w / 2 - 10, -h / 2 - 10, w + 20, h + 20, 20, 'rgba(255,236,39,' + (0.55 + 0.35 * Math.sin(G.t * 10)) + ')'); }
  rr(-w / 2 + 4, -h / 2 + 6, w, h, 14, 'rgba(0,0,0,0.3)');
  rr(-w / 2, -h / 2, w, h, 14, o.dim ? '#d8cfc0' : PAL.cream, PAL.ink, 5);
  let cx = -w / 2 + 22;
  txt(it.pre, cx + pw / 2, 2, { size, color: PAL.ink }); cx += pw;
  const gx = cx + gw / 2;
  if (o.fill) { rr(cx + 3, -h / 2 + 8, gw - 6, h - 16, 8, o.fillBg || '#c9f7c9'); txt(o.fill, gx, 2, { size, color: o.fillC || PAL.dgreen }); }
  else { rr(cx + 3, -h / 2 + 8, gw - 6, h - 16, 8, o.hl ? '#fff6a8' : '#eadfc6', PAL.ink, 3); txt('?', gx, 2, { size: size * 0.8, color: o.hl ? PAL.red : '#b9ab9a', font: 'PX' }); }
  if (o.cross) { txt(o.cross, gx, 2, { size, color: PAL.red }); c.strokeStyle = PAL.red; c.lineWidth = 6; c.beginPath(); c.moveTo(gx - 22, 16); c.lineTo(gx + 22, -16); c.stroke(); }
  cx += gw; txt(it.post, cx + qw / 2, 2, { size, color: PAL.ink });
  c.restore(); return w;
}

  target() { let t = null; for (const c of this.cows) if (c.st === 'fall' && (!t || c.y > t.y)) t = c; return t; }

    c.fillStyle = PAL.ink; c.beginPath(); c.moveTo(370, 480); c.lineTo(910, 480); c.lineTo(860, 370); c.lineTo(420, 370); c.fill();
    c.fillStyle = '#3a3440'; c.beginPath(); c.moveTo(380, 474); c.lineTo(900, 474); c.lineTo(854, 376); c.lineTo(426, 376); c.fill();
    for (let k = 0; k < 7; k++) { c.fillStyle = (Math.floor(G.t * 4) + k) % 3 ? '#5a0a22' : PAL.red; c.beginPath(); c.arc(460 + k * 60, 455, 8, 0, 7); c.fill(); }
    txt('FALTÓMETRO 3000', 640, 410, { size: 34, font: 'PX', color: PAL.yellow, outline: 6 });
    // cúpula
    const R = 138;
    c.save(); c.beginPath(); c.arc(640, 250, R, 0, 7); c.clip();
    rect(640 - R, 250 - R, R * 2, R * 2, '#2a1236');
    if (this.shatter < 1) drawAlvaro(this.face, 640, 292 + this.shatter * 500, 2.5, { rot: this.shatter * 1.5, talk: !!this.say_ || this.face === 'laugh', hit: this.hurtT > 0.15 });
    if (this.dest > 0) drawDestello(640, 300, 2.5, this.dest);
    c.restore();
    if (this.shatter < 0.05) { c.fillStyle = 'rgba(160,230,255,0.18)'; c.beginPath(); c.arc(640, 250, R, 0, 7); c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 8; c.stroke(); c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 6; c.beginPath(); c.arc(640, 250, R - 22, 3.6, 4.4); c.stroke(); }
    else { c.strokeStyle = 'rgba(200,240,255,0.8)'; c.lineWidth = 4; for (let k = 0; k < 10; k++) { const a = k * 0.63; c.beginPath(); c.moveTo(640, 250); c.lineTo(640 + Math.cos(a) * R * (1 + this.shatter), 250 + Math.sin(a) * R * (1 + this.shatter)); c.stroke(); } }
    const dmgC = 1 - this.hp / 100; if (dmgC > 0.3 && this.shatter < 0.05) { c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 3; c.beginPath(); c.moveTo(560, 170); c.lineTo(590, 210); c.lineTo(580, 240); if (dmgC > 0.6) { c.moveTo(720, 160); c.lineTo(700, 200); c.lineTo(730, 230); } c.stroke(); }
    rect(620, 100, 40, 14, PAL.ink); c.fillStyle = Math.floor(G.t * 3) % 2 ? PAL.red : PAL.dred; c.beginPath(); c.arc(640, 96, 12, 0, 7); c.fill();
    c.restore();
    { const happy = this.face === 'shock' && this.faceT > 0, sad = this.face === 'laugh'; drawRojelio(1060, 240 + this.bY * 0.5, 3.6, { expr: happy ? 'happy' : sad ? 'worried' : (this.dead ? 'happy' : 'normal'), pose: happy || this.dead ? 'cheer' : sad ? 'shrug' : 'idle', legs: false }); }
    // boli que cae
    if (this.pen && this.phase < 3 && this.q) {
      const s = this.q.side ? 1 : -1, x0 = 640 + s * 330, y0 = 170, x1 = 640 + s * 60, y1 = 470, p = clamp(this.pen.p, 0, 1);
      const px = lerp(x0, x1, p), py = lerp(y0, y1, p) - Math.sin(p * Math.PI) * 60;
      spr(ART.penProj, px, py, 5, { rot: this.pen.back ? 0 : Math.PI });
      if (!this.pen.back) { c.globalAlpha = 0.3; txt('!', px + 40, py, { size: 50, font: 'PX', color: PAL.red }); c.globalAlpha = 1; }
    }
    if (this.pen && this.phase === 3 && this.pen.back) { const p = this.pen.p; spr(ART.penProj, 640, lerp(170 + this.bY, 700, p), 5); }
    // pregunta
    if ((this.state === 'q' || this.state === 'fly' || this.state === 'wait') && this.phase < 3 && this.q && this.opts[0].vis) {
      panel(160, 500, 960, 96, PAL.cream);
      const pr = this.q.ctx ? this.q.prompt.replace('___', '_____') : this.q.prompt;
      txt(pr, 640, 548, { size: tw_(pr, 36) > 900 ? 30 : 36, color: PAL.ink });
      if (this.state === 'q') { const k = 1 - this.q.t / this.q.T; rr(160, 598, 960 * k, 10, 5, k > 0.3 ? PAL.green : PAL.red); }
    }
    if (this.phase === 3 && this.kb && this.state === 'dict') {
      this.kb.drawField(330, 300, 620, 100, { size: 52 });
      if (this.peek > 0) { rr(330, 190, 620, 96, 16, PAL.yellow, PAL.ink, 5); txt(this.d.w, 640, 238, { size: 56, color: PAL.ink }); }
    }
    if (this.lastD) { const d = this.lastD; panel(330, 300, 620, 100, d.ok ? '#c9f7c9' : '#ffd6de'); txt(d.ok ? '¡' + d.w + '! ¡Perfecta!' : 'Era: ' + d.w, 640, 350, { size: 44, color: d.ok ? PAL.dgreen : PAL.red }); }
    for (const b of this.btns) if (b !== this.pauseBtn) b.draw();
    // bocadillo del jefe
    if (this.say_) { if (this.phase === 3 && !this.dead) bubble(this.say_.s, 780, 250, 440, { size: 24, tailX: 800 }); else bubble(this.say_.s, 800, 150 + this.bY * 0.6, 400, { size: 26, tailX: 820 }); }
    // HUD
    this.hud(() => {
      rr(430, 20, 420, 36, 10, PAL.ink); rr(434, 24, 412 * this.hp / 100, 28, 8, PAL.red); txt('FALTÓMETRO', 640, 39, { size: 22, font: 'PX', color: PAL.cream });
      
    });
    for (let i = 0; i < this.maxG; i++) spr(i < this.gomas ? ART.goma : ART.gomaOff, 50 + i * 58, 112, 3.2);
    txt('Gomas', 50 + this.maxG * 58, 112, { size: 22, font: 'PX', color: PAL.cream, align: 'left', outline: 5 });
    if (this.ban) { const k = Math.min(1, this.ban.t * 4); rect(0, 300, W, 200 * k, 'rgba(26,16,32,0.9)'); if (k >= 1) { txt(this.ban.a, 640, 360, { size: 70, font: 'PX', color: PAL.red, outline: 10 }); txt(this.ban.b, 640, 440, { size: 44, font: 'PX', color: PAL.yellow, outline: 8 }); } }
    this.drawTip(); this.drawPause();
  }
  key(e) { if (this.kb && this.state === 'dict') this.kb.key(e); }
}

/* ------------------- Recreo infinito ------------------- */
class Arcade {
  enter() {
    this.btns = []; const t = Game.team;
    const list = [];
    CAPS.slice(0, 5).forEach((cap, i) => { if (Store.d.unlockAll || t.stars[i] >= 1) list.push({ cap, mode: '', name: cap.name, topic: cap.topic }); });
    if (Store.d.unlockAll || t.stars[0] >= 1) { list.push({ cap: CAPS[0], mode: 'gj', name: 'Vacas de la G y la J', topic: 'G o J · 2.º trimestre' }); list.push({ cap: CAPS[0], mode: 'lly', name: 'Vacas de la LL y la Y', topic: 'LL o Y · 3.º trimestre' }); }
    list.forEach((it, k) => {
      const x = 60 + (k % 4) * 295, y = 170 + Math.floor(k / 4) * 230;
      this.btns.push(new Btn({ x, y, w: 275, h: 210, color: it.cap.color, label: '', icon: (cx, cy) => {
        wrap(it.name, 240, 30, 'PX').forEach((l, j) => txt(l, cx, cy - 60 + j * 34, { size: 30, font: 'PX', color: PAL.cream, outline: 6 }));
        txt(it.topic, cx, cy + 20, { size: 22, color: PAL.ink });
        txt('Récord: ' + (t.best[it.cap.id + it.mode] || 0), cx, cy + 66, { size: 26, font: 'PX', color: PAL.ink });
      }, onTap: () => go(() => it.cap.make({ endless: true, mode: it.mode || undefined })) }));
    });
    this.empty = !list.length;
    this.btns.push(new Btn({ x: 30, y: 24, w: 170, h: 70, label: 'MAPA', size: 28, color: PAL.dgrey, onTap: () => go(() => new MapScene()) }));
    Sound.play('mapa');
  }
  draw() {
    bg('title'); rect(0, 0, W, H, 'rgba(20,8,30,0.6)');
    txt('RECREO INFINITO', W / 2, 70, { size: 54, font: 'PX', color: PAL.yellow, outline: 10 });
    txt('Tres gomas de borrar. Cada fallo gasta una. ¿Hasta dónde llegáis?', W / 2, 126, { size: 26, color: PAL.cream });

    for (const b of this.btns) b.draw();
  }
}

  Sound.setMusic(Store.d.settings.music !== false); Sound.setSfx(Store.d.settings.sfx !== false);
